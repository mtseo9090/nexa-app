name: Build NEXA AI app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create the project
        run: flutter create --org pk.nexa --project-name nexa_ai --platforms android app
      - name: Add the parts the app uses
        run: cd app && flutter pub add mobile_scanner speech_to_text shared_preferences "pointycastle:^3.9.1"
      - name: Put NEXA's code in
        run: rm -f app/lib/*.dart && cp lib/*.dart app/lib/ && python3 patch_android.py app
      - name: Build the app
        run: cd app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-app
          path: app/build/app/outputs/flutter-apk/app-release.apk
